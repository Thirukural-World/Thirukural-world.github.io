  function getSavedAboutLang() {
    const keys = ["dk_lang", "daily_kural_lang", "app_lang", "selectedLang"];
    for (let i = 0; i < keys.length; i++) {
      try {
        const val = localStorage.getItem(keys[i]);
        if (val === "ta" || val === "en" || val === "hi") return val;
      } catch (e) {}
    }
    const htmlLang = document.documentElement.getAttribute("data-lang") || document.documentElement.lang;
    if (htmlLang === "en" || htmlLang === "hi" || htmlLang === "ta") return htmlLang;
    return "ta";
  }

  window.setAboutLang = function(lang) {
    const code = (lang === "en" || lang === "hi") ? lang : "ta";
    const t = ABOUT_I18N[code];

    document.documentElement.lang = code;
    document.documentElement.setAttribute("data-lang", code);
    try {
      localStorage.setItem("dk_lang", code);
      localStorage.setItem("daily_kural_lang", code);
    } catch (e) {}

    document.getElementById("btnAboutTa").classList.toggle("active", code === "ta");
    document.getElementById("btnAboutEn").classList.toggle("active", code === "en");
    document.getElementById("btnAboutHi").classList.toggle("active", code === "hi");

    document.getElementById("abHeroTitle").textContent = t.heroTitle;
    document.getElementById("abHeroSub").textContent = t.heroSub;
    document.getElementById("abVisionTitle").textContent = t.visionTitle;
    document.getElementById("abVisionP1").innerHTML = t.visionP1;
    document.getElementById("abVisionP2").innerHTML = t.visionP2;
    document.getElementById("abSourcesTitle").textContent = t.sourcesTitle;
    document.getElementById("abSrc1").innerHTML = t.src1;
    document.getElementById("abSrc2").innerHTML = t.src2;
    document.getElementById("abSrc3").innerHTML = t.src3;

    document.getElementById("thLang").textContent = t.thLang;
    document.getElementById("thSource").textContent = t.thSource;
    document.getElementById("thAuthor").textContent = t.thAuthor;
    document.getElementById("thEdition").textContent = t.thEdition;
    document.getElementById("thRole").textContent = t.thRole;

    const tbody = document.getElementById("abTableBody");
    tbody.innerHTML = t.rows.map(function(row) {
      return "<tr><td>" + row[0] + "</td><td>" + row[1] + "</td><td>" + row[2] + "</td><td>" + row[3] + "</td><td>" + row[4] + "</td></tr>";
    }).join("");

    document.getElementById("abThanksGemini").textContent = t.thanksGemini;
    document.getElementById("abThanksJio").textContent = t.thanksJio;
    document.getElementById("abBackBtn").textContent = t.backBtn;
  };

  /* Sync automatically if global top-bar language toggle mutates data-lang or localStorage */
  const aboutLangObserver = new MutationObserver(function(mutations) {
    mutations.forEach(function(m) {
      if (m.attributeName === "data-lang") {
        const updated = document.documentElement.getAttribute("data-lang");
        if (updated === "ta" || updated === "en" || updated === "hi") {
          setAboutLang(updated);
        }
      }
    });
  });
  aboutLangObserver.observe(document.documentElement, { attributes: true });

  window.addEventListener("storage", function(e) {
    if ((e.key === "dk_lang" || e.key === "daily_kural_lang") && e.newValue) {
      setAboutLang(e.newValue);
    }
  });

  /* Sync dark/light mode if opened standalone */
  (function initAboutTheme() {
    try {
      const savedTheme = localStorage.getItem("daily_kural_theme");
      if (savedTheme === "dark") document.documentElement.classList.add("dark-mode");
    } catch (e) {}
  })();

  setAboutLang(getSavedAboutLang());
</script>
